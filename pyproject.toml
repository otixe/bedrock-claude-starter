[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bedrock-claude-starter"
version = "0.1.0"
description = "Production-ready boilerplate for Claude agents on AWS Bedrock with semantic memory"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Otixe Cifuentes", email = "https://github.com/otixe" }]
keywords = [
    "claude", "bedrock", "aws", "agent", "llm",
    "qdrant", "semantic-memory", "tool-use", "agentic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.5",
    "qdrant-client>=1.10",
    "typer>=0.12",
    "rich>=13.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "moto>=5.0",
]

[project.scripts]
agent = "bedrock_claude_starter.cli:app"

[project.urls]
Homepage = "https://github.com/otixe/bedrock-claude-starter"
Repository = "https://github.com/otixe/bedrock-claude-starter"
Issues = "https://github.com/otixe/bedrock-claude-starter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_claude_starter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "T20", "RET", "SIM", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=src/bedrock_claude_starter --cov-report=term-missing"
testpaths = ["tests"]
